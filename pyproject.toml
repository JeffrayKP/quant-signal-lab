[project]
name = "quant-signal-lab"
version = "4.3.1"
description = "Leakage-aware equity research and portfolio risk dashboard"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.48,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "plotly>=6.0,<7",
  "yfinance>=0.2.65,<2",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "requests>=2.32,<3",
  "defusedxml>=0.7,<1",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=7,<8", "ruff>=0.16,<1", "bandit>=1.9,<2", "pip-audit>=2.10,<3", "pypdf>=6.10,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"app.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
